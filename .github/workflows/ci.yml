name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:game
      - run: npm run test
      - run: npm run build
      # Enabled in Phase 13, once there is a game to drive.
      # - run: npx playwright install --with-deps chromium
      # - run: npm run test:e2e
